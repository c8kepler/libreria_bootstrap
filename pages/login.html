<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión - Librθmente</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  </head>

  <body>
    <div id="tema-switch-contenedor">
      <label class="tema-switch" for="tema-switch">
        <input
          class="tema-switch-input"
          type="checkbox"
          role="switch"
          id="tema-switch"
          aria-label="Cambiar tema"
        />
        <span class="tema-switch-slider" aria-hidden="true">
          <span class="tema-switch-luna"><i class="bi bi-moon"></i></span>
          <span class="tema-switch-sol"><i class="bi bi-sun"></i></span>
        </span>
      </label>
    </div>
    <div class="container">
      <main>
        <img
          src="../Logo.png"
          alt="Logo de Libromente"
          class="img-fluid mb-3"
          width="200"
        />

        <form id="form-login">
          <div>
            <label class="form-label" for="email">Correo Electrónico:</label>
            <input
              type="email"
              class="form-control"
              id="email"
              required
              placeholder="Escribe tu correo electrónico"
            />
          </div>

          <div>
            <label class="form-label" for="password">Contraseña:</label>
            <input
              type="password"
              class="form-control"
              id="password"
              required
              placeholder="Escribe tu contraseña"
            />
          </div>

          <div id="mensaje-error" role="alert" hidden></div>

          <button class="btn btn-primary" type="submit">Ingresar</button>
        </form>

        <a href="../index.html">Volver al Inicio</a>
      </main>
    </div>

    <script src="js/tema.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
