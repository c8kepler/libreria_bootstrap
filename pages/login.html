<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - BiblioWeb</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
</head>

<body>
    <button id="btn-tema" type="button">Tema</button>

    <main>
        <h1>BiblioWeb Login</h1>

        <form id="form-login">
            <div>
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="Escribe tu correo electrónico">
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Escribe tu contraseña">
            </div>

            <div id="mensaje-error" role="alert" hidden></div>

            <button type="submit">Ingresar</button>
        </form>

        <a href="../index.html">Volver al Inicio</a>
    </main>

<script src="js/tema.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
